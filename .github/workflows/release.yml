name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Pack
        run: |
          name="super-coding-${GITHUB_REF_NAME#v}"
          mkdir -p "dist/${name}"
          cp -r skills install.py README.md README.zh-CN.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="super-coding-${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" "dist/${name}.tar.gz" "dist/${name}.tar.gz.sha256" \
            --title "super-coding ${GITHUB_REF_NAME}" --generate-notes
