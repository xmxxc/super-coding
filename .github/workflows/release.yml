name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Pack
        run: |
          name="surper-coding-${GITHUB_REF_NAME#v}"
          mkdir -p "dist/${name}"
          cp -r skills install.py README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="surper-coding-${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" "dist/${name}.tar.gz" "dist/${name}.tar.gz.sha256" \
            --title "surper-coding ${GITHUB_REF_NAME}" --generate-notes
